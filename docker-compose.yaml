name: mimic-data-pipeline

services:
  mariadb:
    image: mariadb:12.3.3
    environment:
      MARIADB_ROOT_PASSWORD: "${PIPELINE_MARIA_ROOT_PASSWORD:?Set PIPELINE_MARIA_ROOT_PASSWORD}"
      MARIADB_DATABASE: mimic_pipeline
      MARIADB_USER: mimic
      MARIADB_PASSWORD: "${PIPELINE_MARIA_PASSWORD:?Set PIPELINE_MARIA_PASSWORD}"
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - maria_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mimic_pipeline
      POSTGRES_USER: mimic
      POSTGRES_PASSWORD: "${PIPELINE_PG_PASSWORD:?Set PIPELINE_PG_PASSWORD}"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimic -d mimic_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  maria_data:
  pg_data: